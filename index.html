<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { text-align: center; background: #fff; padding: 2rem 3rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    p { color: #555; margin: 0.5rem 0 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Redirecting…</h1>
    <p id="status">Copying to clipboard and redirecting.</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var url = params.get('u');
      var text = params.get('c');
      if (text !== null) {
        text = text.replace(/\\n/g, '\n');
      }

      if (!url) {
        document.getElementById('status').textContent = 'No URL provided (u parameter is missing).';
        return;
      }

      function redirect() {
        window.location.href = url;
      }

      function execCommandCopy() {
        if (!text) return false;
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (e) {
          return false;
        }
      }

      function showManualButton() {
        var status = document.getElementById('status');
        status.textContent = 'Click the button below to copy and continue.';
        var btn = document.createElement('button');
        btn.textContent = 'Copy & Continue';
        btn.style.cssText = 'margin-top:1rem;padding:0.5rem 1.5rem;font-size:1rem;cursor:pointer;';
        btn.addEventListener('click', function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(redirect, function () {
              execCommandCopy();
              redirect();
            });
          } else {
            execCommandCopy();
            redirect();
          }
        });
        document.querySelector('.box').appendChild(btn);
      }

      if (text && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(redirect, function (err) {
          // Firefox (and others) may deny clipboard access without a user gesture.
          // Fall back to showing a button the user can click.
          showManualButton();
        });
      } else {
        // Fallback for browsers without Clipboard API
        if (text) {
          execCommandCopy();
        }
        redirect();
      }
    })();
  </script>
</body>
</html>
